<title>chipbook demo</title>
<style>
/* CHIPBOOK IS LIGHT - SAID AT THE LEVEL OF THE WHOLE PAGE.
CAUGHT ON A PHONE: with dark mode switched on, iOS repainted the form
fields black even though they had a white background in the code. The
declaration on my own screen was not enough - the phone reads it
EXCLUSIVELY from the root of the page. */
:root{color-scheme:light}

:root{
  --bg:#f4f5f8;
  --panel:#ffffff;
  --border:#e3e6ec;
  --border-strong:#d2d7df;
  --text:#0f1319;
  --faint:#5f6875;
  --fainter:#8d95a3;
  --accent:#c2410c;
  --accent-dark:#9a3412;
  --accent-bg:#fff5ef;
  --accent-border:#f3cdb4;
  --graphite:#13161b;
  --graphite-light:#242a33;
  --green:#116b45;
  --green-bg:#eaf6f0;
  --red:#b42318;
  --red-bg:#fef3f2;
  --shadow:0 1px 2px rgba(16,19,25,.05), 0 1px 3px rgba(16,19,25,.04);
  --shadow-strong:0 8px 24px rgba(16,19,25,.10), 0 2px 6px rgba(16,19,25,.06);
  --r:9px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
button,input,textarea{font:inherit;color:inherit}
/* HIDDEN IS TO MEAN HIDDEN - a general rule, for the whole page.
The `hidden` attribute works by the browser giving the element
display:none - but EVERY rule of our own with a class is stronger and
undoes that hiding. Caught twice within an hour: first the screen with
the code (.gate, display:flex) rolled to the top even on the laptop,
then the same bug came back on a new button (.btn,
display:inline-flex). Rather than correcting it element by element, we
say it once and for all. */
[hidden]{display:none !important}

/* ---------------------------------------------- the view from a phone
From a phone we do EXACTLY two things besides searching: a photo and a
note (widened later to cover photos - the camera is in the phone alone,
so a photo of the part has no other road into the database).
Everything else goes: a new entry (three obligatory fields on a small
screen), editing, deleting and opening things on the laptop, where
nobody is standing.
THE DISTINCTION GOES BY DEVICE, NOT BY SCREEN WIDTH - a narrow window on
the laptop is to have everything. The hiding is only so as not to
promise what is not there; the real gate stands in the server. */
body[data-remote="1"] #btn-new,
body[data-remote="1"] #btn-edit,
body[data-remote="1"] #btn-folder,
body[data-remote="1"] #delete-zone{display:none !important}
/* ---------------------------------------------------------- bar */
.bar{
  display:flex;align-items:center;gap:20px;
  height:58px;padding:0 18px;flex:0 0 auto;
  background:var(--graphite);color:#fff;
}
/* The logo is also a "home" button - the way it is on websites.
Reported from use: there was no way at all to get back to the starting
state without restarting the program. */
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;
  font-size:15px;cursor:pointer;padding:5px 8px;margin-left:-8px;border-radius:8px;
  transition:background .12s}
.brand:hover{background:#20262f}
.brand:focus-visible{outline:2px solid #4b5665;outline-offset:1px}
.brand svg{display:block}
.searchbox{
  position:relative;flex:1;max-width:620px;display:flex;align-items:center;gap:8px;
}
/* The field holds its own piece of the bar at a fixed height, and the
field itself lies ON TOP of it (absolutely). Thanks to that, in AI mode
it can grow downwards without moving the bar or the list below. */
.field-wrap{position:relative;flex:1;height:36px}
.field-wrap svg{position:absolute;left:13px;top:11px;color:#8b94a3;pointer-events:none;z-index:2}
.field-wrap textarea{
  position:absolute;left:0;top:0;z-index:1;
  width:100%;height:36px;
  /* min-height:0 is NECESSARY: further down this file stands a rule
  textarea{min-height:190px} written for the notes field, and min-height
  beats height. Without this the search field spread over half the screen -
  caught live. */
  min-height:0;
  padding:8px 14px 8px 38px;
  background:var(--graphite-light);border:1px solid #2f3743;border-radius:8px;
  color:#fff;outline:none;resize:none;overflow:auto;
  font:inherit;line-height:1.25;
  transition:border-color .12s,background .12s,height .12s;
}
.field-wrap textarea::placeholder{color:#78818f}
.field-wrap textarea:focus{border-color:#4b5665;background:#2a313b}
/* The same colour as the default field (--graphite-light #242a33), only
letting the light through - it is visible that the list underneath has
not gone, it is merely covered. The blur means the text underneath does
not get in the way of reading what is being typed. */
.field-wrap textarea.question{
  height:132px;
  /* The top in the colour of the default field, the bottom a little darker -
  thanks to that the expanded field has a floor rather than melting into
  the list below. */
  background:linear-gradient(180deg,
             rgba(33,39,48,.90) 0%,
             rgba(14,17,22,.97) 100%);
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
  box-shadow:0 14px 30px rgba(0,0,0,.3);
}
.searchbox .btn-search{
  /* z-index over the expanded field - otherwise its shadow would cover moreBtn */
  position:relative;z-index:3;
  flex:0 0 auto;height:36px;padding:0 16px;border-radius:8px;border:0;
  background:var(--accent);color:#fff;font:inherit;font-weight:600;
  cursor:pointer;transition:background .12s;
}
.searchbox .btn-search:hover{background:var(--accent-dark)}
/* ===================== AI MODE: THE BAR AND THE WINDOW =====================
In manual mode this piece of the beam is the search field. In AI mode the
field has nothing to do there (it neither searches nor asks), so it GIVES
UP ITS PLACE to the conversation bar. The "Search" button goes with it.
The bar DELIBERATELY does not look like a field to type in - it is orange,
with a spark and the word "open". One place in two meanings works only
when the two look different. */
.bar-ai{
  position:absolute;left:0;top:0;width:100%;height:36px;z-index:4;
  display:flex;align-items:center;gap:9px;padding:0 10px 0 12px;
  border-radius:8px;cursor:pointer;font:inherit;text-align:left;
  background:linear-gradient(90deg,rgba(194,65,12,.24),rgba(194,65,12,.10));
  border:1px solid rgba(243,205,180,.45);color:#fff;
  opacity:0;transform:translateY(-4px);pointer-events:none;
  transition:opacity .18s,transform .18s;
}
body[data-ai="1"] .bar-ai{opacity:1;transform:none;pointer-events:auto}
body[data-ai="1"] .field-wrap textarea,
body[data-ai="1"] .field-wrap svg{opacity:0;pointer-events:none}
body[data-ai="1"] .searchbox .btn-search{display:none}
.bar-ai:hover{background:linear-gradient(90deg,rgba(194,65,12,.34),rgba(194,65,12,.16))}
.bar-ai .spark{width:14px;height:14px;color:#f6b48d;flex:0 0 auto}
.bar-ai .what{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-ai .count{color:#d3ac97;font-size:12.5px;white-space:nowrap}
.bar-ai .back{margin-left:auto;color:#f6b48d;font-size:12px;font-weight:600;white-space:nowrap}

/* THE CONVERSATION WINDOW. It folds away with a click beside it and comes
back with a click on the bar - thanks to that the jobs can be looked at
without losing the conversation. `visibility`, not transparency alone:
otherwise the writing field would hold the cursor in a hidden window and
the browser would scroll the page to it. */
.ai-window{
  position:absolute;left:14px;top:14px;width:600px;max-width:calc(100% - 28px);
  z-index:30;background:var(--panel);border:1px solid var(--border-strong);
  border-radius:12px;box-shadow:var(--shadow-strong);
  display:flex;flex-direction:column;max-height:calc(100% - 28px);
  opacity:0;transform:translateY(-8px) scale(.99);pointer-events:none;
  visibility:hidden;transition:opacity .18s,transform .18s,visibility 0s linear .18s;
}
body[data-ai-window="open"] .ai-window{
  opacity:1;transform:none;pointer-events:auto;visibility:visible;
  transition:opacity .18s,transform .18s,visibility 0s;
}
.ai-window .heading-ai{
  display:flex;align-items:center;gap:8px;padding:11px 12px 10px 14px;
  border-bottom:1px solid var(--border);flex:0 0 auto;
}
.ai-window .heading-ai .title{
  display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
}
.ai-window .heading-ai .spark{width:14px;height:14px}
.ai-window .collapse{
  margin-left:auto;width:28px;height:28px;border:0;background:transparent;
  border-radius:7px;cursor:pointer;color:var(--faint);font-size:16px;
  display:grid;place-items:center;font-family:inherit;
}
.ai-window .collapse:hover{background:#f1f3f6;color:var(--text)}
/* Inside the window the chat needs no background or line of its own - the
window is itself the sheet of paper. */
.ai-window .chat{background:transparent;border-bottom:0;padding:12px 0}
.ai-window .chat[hidden]{display:none}

@media (max-width:860px){
  /* THE PHONE: the window comes in FROM THE BOTTOM, because the keyboard
  takes the lower half of the screen - with the window at the top one would
  be typing blind. The field and the buttons stay above the keyboard, and
  the sheet does not cover the whole list. */
  .ai-window{
    left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;
    border-radius:14px 14px 0 0;border-left:0;border-right:0;border-bottom:0;
    max-height:76%;transform:translateY(10px);
  }
}

.bar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.counter{color:#8b94a3;font-size:12.5px;white-space:nowrap}
/* The address for the phone - it is to catch the eye more than the version
does, because a person COPIES IT OUT rather than merely reading it. */
.phone-address{color:#f0762e;font-weight:600;font-variant-numeric:tabular-nums}
/* A small, quiet button beside the code - it is to be at hand but not to
invite clicking, because it cuts the phones off. */
.btn-small{height:26px;padding:0 10px;font-size:12px}
/* The button with the code shown. It has to look different from a button
meant for clicking - so that one glance says this is no longer an
invitation but a figure to copy out. */
.btn-small.shown{
  background:var(--accent);border-color:var(--accent);color:#fff;
  font-weight:700;font-size:14px;letter-spacing:3px;
  font-variant-numeric:tabular-nums;padding:0 12px;
}

.btn{
  display:inline-flex;align-items:center;gap:8px;
  height:36px;padding:0 14px;border-radius:8px;
  border:1px solid transparent;background:#fff;color:var(--text);
  cursor:pointer;font-weight:550;white-space:nowrap;
  transition:background .12s,border-color .12s,box-shadow .12s,transform .04s;
}
.btn:active{transform:translateY(.5px)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:var(--accent-dark)}
.btn-light{background:var(--panel);border-color:var(--border-strong);color:var(--text)}
.btn-light:hover{background:#f7f8fa;border-color:#bcc3cd}
.btn-quiet{background:transparent;color:var(--faint);border-color:transparent}
.btn-quiet:hover{background:#eceff3;color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{background:var(--accent)}

.bar-alert{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:11px 18px;background:#fff4e5;border-bottom:1px solid #f0cfa0;
  color:#7a4a10;font-size:13px;
}
.bar-alert svg{flex:0 0 auto}
.bar-alert b{font-weight:650}
.bar-alert[hidden]{display:none}

/* ---------------------------------------------------------- layout */
/* position:relative, because the floating AI conversation window
`#ai-window` hangs here. Without it the coordinates would be counted from
the page. */
main{flex:1;display:flex;min-height:0;padding:14px;gap:14px;position:relative}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
.col-list{flex:0 0 384px;overflow:hidden}
.col-detail{flex:1;overflow:hidden;min-width:0}

.heading-panel{
  display:flex;align-items:center;gap:10px;flex:0 0 auto;
  padding:12px 16px;border-bottom:1px solid var(--border);
}
.heading-panel h2{margin:0;font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.heading-panel .count{margin-left:auto;font-size:12px;color:var(--fainter)}

/* ---------------------------------------------------------- list */
.list{overflow-y:auto;flex:1;min-height:0}
.row{
  display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid #f0f2f5;border-left:3px solid transparent;
  padding:12px 16px 13px;cursor:pointer;transition:background .1s;
}
.row:hover{background:#f8f9fb}
.row.chosen{background:var(--accent-bg);border-left-color:var(--accent)}
.row-top{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.badge{
  font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px;background:#eef1f5;color:#3d4552;
  max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chosen .badge{background:#fbe4d5;color:var(--accent-dark)}
.data{margin-left:auto;font-size:11.5px;color:var(--fainter);white-space:nowrap}
.snippet{color:var(--faint);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta-row{margin-top:6px;font-size:11.5px;color:var(--fainter);display:flex;gap:12px;flex-wrap:wrap}
.meta-row span{display:inline-flex;align-items:center;gap:4px}
mark{background:#ffe4a3;color:inherit;border-radius:3px;padding:0 1px}

.correction[hidden]{display:none}
.correction{
  flex:0 0 auto;display:flex;gap:9px;align-items:flex-start;
  margin:12px 16px 0;padding:10px 12px;border-radius:8px;
  background:#fffaf0;border:1px solid #f2e0bd;color:#7a5b17;font-size:12.5px;
}
.correction svg{flex:0 0 auto;margin-top:1px}

/* ---------------------------------------- switch: by hand / AI */
.modes{display:flex;gap:2px;padding:2px;background:#232a34;border-radius:8px;flex:0 0 auto}
.modes button{
  height:30px;padding:0 13px;border:0;border-radius:6px;cursor:pointer;
  background:transparent;color:#98a1af;font-size:12.5px;font-weight:600;
  font-family:inherit;transition:background .12s,color .12s;
}
.modes button:hover{color:#dfe4ea}
.modes button.chosen{background:#3a434f;color:#fff}

/* The model's answer. DELIBERATELY a different background from the jobs -
a person is to see at first glance that this sentence was composed by the
model and is not a quotation from the database. The sources below are
ordinary entries out of the search. */
.answer-ai[hidden]{display:none}
.answer-ai{
  flex:0 0 auto;margin:12px 16px 0;padding:12px 13px;border-radius:8px;
  background:#f2f6fb;border:1px solid #cfdcea;color:#26313f;font-size:13px;
  line-height:1.5;
}
.answer-ai .content-ai{display:block;white-space:pre-wrap}
/* THE CHAT IS A SEPARATE PART OF THE PROGRAM and is to look like one. Its
own background, its own frame and a clear edge at the bottom - below it
the ordinary jobs begin and that has to be visible. */
.chat[hidden]{display:none}
.chat{
  /* A NEUTRAL background, with no blue - otherwise it merged with the
  model's bubble, which is cool as well. */
  flex:0 0 auto;background:#f1f2f4;border-bottom:1px solid #d7dae0;
  padding:12px 0 12px;
}
.answer-ai.conversation{background:transparent;border:0;padding:0;margin:0 16px;
  max-height:44vh;overflow:auto;display:flex;flex-direction:column;gap:11px}
.answer-ai .turn{display:flex;flex-direction:column;gap:3px;max-width:92%}
.answer-ai .turn.me{align-self:flex-end;align-items:flex-end}
.answer-ai .turn.ai{align-self:flex-start;align-items:flex-start}
.answer-ai .who{
  font-size:10.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;
  color:#5a636d;
}
.answer-ai .bubble{
  display:block;padding:9px 12px;border-radius:11px;font-size:13px;
  line-height:1.5;white-space:pre-wrap;
}
/* Orange, but LIGHT and soft - not the one from the buttons. Thanks to
that it is visible that this is a person's voice and not something to
click. The dark graphite tried earlier merged with the rest of the
window. */
.answer-ai .bubble.me{
  background:#fbe4d5;border:1px solid #f1c8aa;color:#70401f;
  border-bottom-right-radius:3px;
}
/* A cool blue facing the person's warm bubble - two voices are visible at
once, and neither is an ordinary white sheet of paper. */
.answer-ai .bubble.ai{
  background:#d6e6f6;border:1px solid #b2cde7;color:#1d2b38;
  border-bottom-left-radius:3px;
}
.answer-ai .bubble.waiting{color:var(--faint);font-style:italic;background:transparent;border:0;padding-left:0}
/* A FAILURE IS NOT AN ANSWER AND THE WINDOW HAS TO SAY SO. These are the
colours the answer field carried for this same purpose back when there was
one answer instead of a conversation - the rule sat on the container, where
it could never fire, because a conversation is not one answer. It belongs
on the turn that failed, the way the waiting state above already does. */
.answer-ai .bubble.failed{
  background:#fdf1ef;border:1px solid #e7c3bd;color:#7d2b20;
}

/* THE "TALKING ABOUT:" BAR. It says WHICH job further questions go to.
WHITE AND NOT IN THE ACCENT COLOUR, and that is not a matter of taste -
both reasons already stand in comments in this file: orange here means
"click me" (and the bar is information, not a button), and the accent
background #fff5ef lies a hair from the person's bubble #fbe4d5 and would
merge with it. */
.bar-conversation[hidden]{display:none}
.bar-conversation{
  display:flex;align-items:center;gap:9px;
  margin:0 16px 11px;padding:7px 8px 7px 12px;
  background:#fff;border:1px solid var(--border-strong);border-radius:9px;
}
.bar-conversation .label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  font-weight:650;color:var(--fainter);flex:0 0 auto;
}
.bar-conversation .name{
  font-weight:650;font-size:13px;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bar-conversation .note{
  color:var(--faint);font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* Red, because in chipbook red means "take it off" everywhere else. Grey
was tried on the photos and got lost in the row. */
.bar-conversation .unpin{
  margin-left:auto;flex:0 0 auto;width:26px;height:26px;
  border:0;border-radius:7px;background:transparent;color:var(--red);
  font-size:16px;line-height:1;cursor:pointer;
}
.bar-conversation .unpin:hover{background:var(--red-bg)}
/* On a narrow screen the customer and the material go FIRST. The room goes
to the name, because that is what tells the jobs apart. */
@media (max-width: 820px){
  .bar-conversation .note{display:none}
}

/* A CANDIDATE TO BE POINTED AT. When chipbook has found several jobs and
is waiting for a person to point at one, the rows say so themselves.
WHY A SENTENCE IN THE BUBBLE WAS NOT ENOUGH: it was read, then clicked -
and the program opened the card instead of choosing. The sentence had
been there from the start; it was not enough even for the person building
the program. */
.row.candidate{border-left-color:var(--accent)}
/* "CHOOSE" IS A BUTTON AND IS TO LOOK LIKE ONE.
Until this change the whole row meant "I choose this one" - and it was
reported that a person wants to SEE the job first. So the row went back to
opening the preview, and choosing got a place of its own to click. */
.row.candidate .choose{
  margin-left:auto;font-size:11.5px;font-weight:650;color:var(--accent);
  white-space:nowrap;cursor:pointer;padding:3px 9px;
  border-radius:6px;border:1px solid var(--accent-border);
  background:var(--accent-bg);
}
.row.candidate .choose:hover{
  background:#fbe4d5;border-color:var(--accent);
}
.row.candidate .data{margin-left:12px}
.heading-panel h2.choice{color:var(--accent)}

/* The field for the rest of the conversation stands UNDER the bubbles, in
the conversation panel - and not in the search bar at the top. That is
where a question starts; here a conversation goes on. */
.chat-field[hidden]{display:none}
.chat-field{
  flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;
  margin:11px 16px 0;
}
.chat-field textarea{
  flex:1;min-height:0;height:56px;resize:none;padding:9px 11px;
  border:1px solid #cbd3dc;border-radius:9px;
  background:#fff;color:var(--text);font:inherit;font-size:13px;
  line-height:1.4;outline:none;
}
/* A cool border while typing. Orange is the colour of buttons in this
window and beside a text field looked like a warning. */
.chat-field textarea:focus{border-color:#9db2c7;
  box-shadow:0 0 0 3px rgba(61,75,92,.10)}
.chat-field button{
  flex:0 0 auto;height:36px;padding:0 15px;border:0;border-radius:8px;
  background:var(--accent);color:#fff;font:inherit;font-weight:600;
  cursor:pointer;transition:background .12s;
}
.chat-field button:hover{background:var(--accent-dark)}
.chat-field button.quiet{background:transparent;color:var(--faint);
  border:1px solid var(--border-strong);font-weight:550;padding:0 11px}
.chat-field button.quiet:hover{background:#f7f8fa;color:var(--text)}
.answer-ai .source{
  display:block;margin-top:9px;padding-top:7px;border-top:1px solid #dbe4ee;
  color:#6b7787;font-size:11.5px;
}
/* THE SOURCE UNDER THE BUBBLE, NOT IN IT (chosen from three variants on a
preview). The bubble is to be as small as the answer - "1.0 mm" and
nothing more. The source is a footnote: small, grey, beside it. The .source
style above stays untouched, because the older road showAnswer uses
it. */
.answer-ai .source-beside{
  margin-top:4px;padding-left:2px;color:var(--fainter);
  font-size:11px;line-height:1.4;
}
/* A WARNING WHEN THE POINTER COULD NOT BE FOUND.
Not red: this is neither an error nor a warning about a mistake. The
answer has support in the text; only the PLACE is unconfirmed. Red would
say something we have not measured. */
.answer-ai .source-beside .uncertain{
  display:block;color:#8a6d1f;
}
/* It looks like a link, because it is one - it unfolds what the model
wrote beyond the answer. */
.answer-ai .more{
  display:block;margin-top:7px;background:transparent;border:0;
  padding:0;color:#5a7a9c;font-size:11.5px;font-weight:600;
  cursor:pointer;text-decoration:underline;font-family:inherit;
}
.answer-ai.empty{background:#f6f7f9;border-color:var(--border-strong);color:var(--faint)}
.answer-ai.waiting{color:var(--faint)}

/* ---------------------------------------------------------- empty-state */
.empty-state{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:44px 32px;text-align:center;color:var(--fainter);
}
.empty-state .icon-big{
  width:44px;height:44px;border-radius:11px;background:#f1f3f7;
  display:flex;align-items:center;justify-content:center;color:#9aa3b2;
}
.empty-state h3{margin:0;font-size:14.5px;font-weight:600;color:var(--faint)}
.empty-state p{margin:0;max-width:330px;font-size:13px;line-height:1.6}

/* ------------------------------------------------------------ detail */
.content{overflow-y:auto;flex:1;min-height:0;padding:26px 30px 34px}
.content-narrow{max-width:760px}
.title{display:flex;align-items:flex-start;gap:14px;margin-bottom:4px}
.title h1{margin:0;font-size:23px;line-height:1.25;font-weight:650;letter-spacing:-.02em}
.title .btn{margin-left:auto;flex:0 0 auto}
.subtitle{color:var(--fainter);font-size:12.5px;margin-bottom:22px}

.grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  gap:1px;background:var(--border);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;margin-bottom:26px;
}
.field{background:var(--panel);padding:11px 13px}
.field dt{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fainter);margin-bottom:3px}
.field dd{margin:0;font-size:13.5px;word-break:break-word}
.field dd.empty{color:#b3bac5;font-style:italic}

.section-title{font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.notes{
  white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.72;
  background:#fbfcfd;border:1px solid var(--border);border-radius:8px;padding:16px 18px;
}
.note-block{margin-top:24px;border-top:1px solid var(--border);padding-top:20px}

/* --------------------------------------------------------------- form */
.form-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.group{display:flex;flex-direction:column;gap:6px;flex:1;min-width:190px}
.group.wide{flex-basis:100%}
label{font-size:12.5px;font-weight:600;color:var(--faint)}
label .star{color:var(--accent);margin-left:2px}
label .opt{font-weight:400;color:var(--fainter);margin-left:5px}
input[type=text],textarea{
  width:100%;background:var(--panel);border:1px solid var(--border-strong);
  border-radius:8px;padding:9px 11px;outline:none;
  transition:border-color .12s,box-shadow .12s;
}
input[type=text]{height:38px}
textarea{resize:vertical;min-height:190px;line-height:1.65}
input[type=text]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(194,65,12,.11)}
.hint{font-size:12px;color:var(--fainter);margin-top:-2px}
.bar-actions{
  display:flex;align-items:center;gap:10px;margin-top:22px;
  padding-top:18px;border-top:1px solid var(--border);
}
.bar-actions .spacer{margin-left:auto}
.form-error-box{
  display:flex;gap:8px;align-items:flex-start;margin-bottom:16px;padding:10px 12px;
  border-radius:8px;background:var(--red-bg);border:1px solid #fbd0cb;
  color:var(--red);font-size:13px;
}

.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:#8f1d14}
.delete-zone{display:flex;align-items:center;gap:8px;margin-left:14px}
.delete-zone .question{font-size:12.5px;color:var(--red);font-weight:600;white-space:nowrap}
.delete-zone .btn{height:30px;padding:0 11px;font-size:12.5px}

/* --------------------------------------------------- content preview */
.file-preview{margin-top:8px}
.preview-notice{
  margin:0 0 12px;padding:9px 11px;border-radius:8px;font-size:12.5px;
  background:#fffaf0;border:1px solid #f2e0bd;color:#7a5b17;
}
.block{margin-bottom:18px}
.block h4{
  margin:0 0 7px;font-size:12px;font-weight:650;letter-spacing:.04em;
  text-transform:uppercase;color:var(--accent-dark);
  display:flex;align-items:center;gap:7px;
}
.block h4 .count-in{
  font-weight:500;letter-spacing:0;text-transform:none;color:var(--fainter);
  background:#eef1f5;border-radius:20px;padding:1px 8px;font-size:11px;
}
.preview-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:1px;background:var(--border);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;margin:0;
}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px}
.table-xml{border-collapse:collapse;width:100%;font-size:12.5px}
.table-xml th{
  background:var(--graphite);color:#fff;text-align:left;font-weight:600;
  padding:7px 10px;white-space:nowrap;font-size:11px;letter-spacing:.03em;
  text-transform:uppercase;
}
.table-xml td{padding:7px 10px;border-top:1px solid var(--border);vertical-align:top}
.table-xml td.field-name{
  color:var(--fainter);font-size:11px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;white-space:nowrap;width:1%;
}
.table-xml th.heading-value{text-transform:none;letter-spacing:0;font-size:12px}
.table-xml tbody tr:nth-child(even){background:#f8f9fb}
.table-xml td:empty:after{content:"-";color:#c3c9d2}

/* ------------------------------------- operations one under another
Repeating sections of a setup sheet used to stand SIDE BY SIDE in
columns - and that was the owner's own wish. The end user worked with it
for a week and said that the vertical reads better; the owner added his
own: "when it is long sideways I scroll and lose track of which column is
which, and that is annoying".
The value is LARGER than the field name, because it is the figure one
reads. There is ONE layout - the same on the laptop and on the phone. */
.op-block{border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;margin-bottom:10px;background:var(--panel)}
.op-top{margin:0 0 8px}
.op-no{font-size:11px;font-weight:650;letter-spacing:.05em;
  text-transform:uppercase;color:var(--fainter)}
.op-title{display:block;font-size:16px;font-weight:600;margin-top:2px}
.op-pair{display:flex;justify-content:space-between;align-items:baseline;
  gap:14px;padding:8px 0;border-top:1px solid var(--border)}
.op-pair:first-of-type{border-top:0}
.op-name{color:var(--fainter);font-size:11px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;flex:0 0 auto}
.op-value{font-size:17px;font-variant-numeric:tabular-nums;
  text-align:right;word-break:break-word}
.show-more{display:block;width:100%;margin-top:4px;padding:13px;
  background:var(--accent-bg);border:1px solid var(--accent-border);
  border-radius:9px;color:var(--accent-dark);font-size:15px;
  font-weight:600;font-family:inherit;cursor:pointer}
.show-more:hover{background:#ffece0}

.file-text{
  margin:0;padding:12px 14px;background:#fbfcfd;border:1px solid var(--border);
  border-radius:8px;max-height:420px;overflow:auto;
  font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;
  white-space:pre;
}
.file-text .no{
  display:inline-block;width:44px;color:#b3bac5;user-select:none;
  text-align:right;padding-right:12px;
}
.file .expand{flex:0 0 auto;height:30px;padding:0 10px;font-size:12.5px}

/* ---------------------------------------------------------- files */
.dropzone{
  border:1.5px dashed var(--border-strong);border-radius:9px;
  padding:16px 18px;text-align:center;color:var(--fainter);font-size:13px;
  cursor:pointer;transition:border-color .12s,background .12s,color .12s;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.dropzone:hover{border-color:#b9c0cb;background:#fafbfc}
.dropzone.over{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-dark)}
.dropzone b{font-weight:600;color:var(--faint)}
.dropzone.over b{color:var(--accent-dark)}
.dropzone .small{font-size:11.5px}

.file{
  display:flex;align-items:center;gap:11px;
  padding:9px 11px;border:1px solid var(--border);border-radius:8px;
  margin-bottom:8px;background:var(--panel);
}
.file .ext{
  flex:0 0 auto;width:34px;height:34px;border-radius:7px;background:#eef1f5;
  color:#4a5361;font-size:9.5px;font-weight:700;letter-spacing:.03em;
  display:flex;align-items:center;justify-content:center;text-transform:uppercase;
  overflow:hidden;
}
.file .middle{flex:1;min-width:0}
.file .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.file .small{font-size:11.5px;color:var(--fainter)}
.file .btn{flex:0 0 auto;height:30px;padding:0 10px;font-size:12.5px}
.file.fading{opacity:.55}
.bar-progress{height:3px;background:#eceff3;border-radius:2px;overflow:hidden;margin-top:6px}
.bar-progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .12s}

/* ---------------------------------------------------------- toast */
.toast{
  max-width:min(560px,90vw);position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
  display:flex;align-items:center;gap:9px;
  padding:11px 16px;border-radius:9px;background:var(--graphite);color:#fff;
  box-shadow:var(--shadow-strong);font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:50;
}
.toast.visible{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--red)}
.toast .tick{color:#6ee7b7}

::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#d6dae1;border:3px solid var(--panel);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#c3c9d2}
::-webkit-scrollbar-track{background:transparent}

@media (max-width:900px){
  main{flex-direction:column;padding:10px;gap:10px}
  .col-list{flex:0 0 42%}
}

/* -------------------------------------------------------------- the gate
The view the phone sees BEFORE being let in. It deliberately shows nothing
out of the database - neither the number of entries nor a name - so that
somebody who lands here by accident learns nothing from this page beyond
the fact that some program is standing here. */
.gate{
  position:fixed;inset:0;z-index:50;
  background:var(--graphite);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
/* WITHOUT THIS ONE LINE THE GATE STANDS ALWAYS. The hidden attribute hides
an element by the browser giving it display:none - but our own rule from
a class (display:flex) is stronger and undoes that hiding. The effect: the
screen with the code covered the program on the laptop too, which had the
token. Caught only after a measurement from PowerShell showed a token of
length 32 while the browser was still asking for the code. */
.gate[hidden]{display:none}
.gate-box{width:100%;max-width:340px;text-align:center;color:#fff}
.gate-box h2{font-size:20px;margin:0 0 10px}
.gate-box p{color:#9aa3b2;font-size:13.5px;line-height:1.5;margin:0 0 20px}
.gate-box input{
  width:100%;height:56px;text-align:center;
  font-size:30px;letter-spacing:10px;font-variant-numeric:tabular-nums;
  background:var(--graphite-light);border:1px solid #2f3743;border-radius:10px;
  color:#fff;outline:none;
}
.gate-box input:focus{border-color:var(--accent)}
.gate-box button{
  width:100%;height:48px;margin-top:14px;border:0;border-radius:10px;
  background:var(--accent);color:#fff;font:inherit;font-weight:600;
  font-size:16px;cursor:pointer;
}
.gate-error{margin-top:14px;color:#ff9d7a;font-size:13.5px;min-height:20px}

/* ------------------------------------------------------------ the phone
A CORRECTION TO WHAT I WROTE MYSELF: I said the file has not one rule for
a narrow screen. It has - it stands above, for 900 pixels, and folds the
two panels into a column. It was written for a narrow WINDOW on a
monitor, not for a phone, but it exists and has to be overridden rather
than wished away.
The phone is to serve searching at the machine, so the point is not "that
it fits", but that THE SEARCH FIELD is the first thing seen.
WHAT GOES: the "New entry" button. Entries are not created from the phone,
and a button promising something that is not there is worse than its
absence - the same principle that deleted the keyboard shortcuts. */
@media (max-width: 820px){
  .bar{flex-wrap:wrap;height:auto;gap:8px;padding:8px 12px}
  /* The order on screen differs from the order in the code: first the name
  and the counter, under them the SEARCH across the full width, and the AI
  switch at the end. */
  .brand{order:1;font-size:16px}
  .bar-right{order:2;gap:10px}
  .searchbox{order:3;flex:1 0 100%;max-width:none}
  .modes{order:4}

  /* A finger does not hit 36 pixels the way a mouse does.
  16px in text fields is NECESSARY on an iPhone: with a smaller font Safari
  zooms the whole page in when a field is touched. */
  /* THE FIELD ON TWO LINES STRAIGHT AWAY. On a large screen the field grows
  only when a person is standing in it (see refreshFieldHeight) - and on a
  monitor that is enough, because the hint text fits on one line. On a phone
  that same text breaks onto two and THE SECOND WAS BEING CUT OFF: what
  could be seen was "Ask a question as a whole sentence and", and the rest
  vanished under the edge. Reported with a screenshot. */
  .field-wrap,.field-wrap textarea{height:62px}
  .searchbox .btn-search{height:44px}
  .field-wrap svg{top:14px}
  .field-wrap textarea{padding-top:11px;padding-bottom:11px;font-size:16px}
  .field-wrap textarea.question{height:150px}
  #chat-input{font-size:16px}
  .modes button{padding:9px 14px}

  main{flex-direction:column;padding:8px;gap:8px}
  /* Overrides the rule from 900 pixels, which gave the list a rigid 42% of
  the height. Since one panel at a time is visible on a phone, it is to take
  the whole free height rather than not quite half. */
  .col-list,.col-detail{flex:1 1 auto;min-height:0}

  /* ONE PANEL AT A TIME: the list, and after a tap on an entry - the entry
  alone, full screen. The way back to the list is a tap on the logo.
  WRITTEN THE OPPOSITE WAY ROUND FROM WHAT INSTINCT SUGGESTS: by default the
  LIST is visible, and it is hidden only under an explicit mode. Were it the
  other way round, for a moment after the page opens - before JavaScript
  sets the mode - nothing would be visible at all. */
  body[data-mode="detail"] .col-list,
  body[data-mode="new"] .col-list{display:none}
  body:not([data-mode="detail"]):not([data-mode="new"]) .col-detail{display:none}

  /* The entry fields one under another - two columns on 390 pixels break
  every longer name. */
  .fields{grid-template-columns:1fr}
  .form-row{flex-direction:column;gap:10px}
  .group{min-width:0}

  /* A setup sheet table is wide by nature and stays that way - it is moved
  sideways with a finger. Narrowing it would mean breaking the figures, and
  those are the only reason anybody looks at it. */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
}
/* THE SCREEN WITH NO LAPTOP - styles written out explicitly, for a NARROW
SCREEN. CAUGHT IN USE: leaning on the window's styles gave dark fields,
blue buttons and a broken header on the phone, because the window has a
layout of its own for phones which my screen was not getting.
The colours are the same as in chipbook, but set here outright. */
#offline-screen{position:fixed;inset:0;z-index:9999;overflow:auto;
  background:#f4f5f7;color:#20242b;
  /* CAUGHT ON A PHONE: with dark mode switched on, iOS repaints form fields
  black BY ITSELF and ignores the background given. This one line tells it
  the screen is light - without it every field looks like a black rectangle
  even though it is white in the code. */
  color-scheme:light;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#offline-screen .off-bar{background:#13161b;padding:12px 14px}
#offline-screen .off-brand{display:flex;align-items:center;gap:9px;
  color:#fff;font-size:19px;font-weight:600;margin-bottom:10px}
#offline-screen .off-logo{width:24px;height:24px;border-radius:6px;
  background:#d8541f;display:inline-block;flex:none}
#offline-screen .off-dimmed{opacity:.35;pointer-events:none}
#offline-screen .off-search{background:#20242b;color:#8a9099;font-size:14px;
  border-radius:8px;padding:10px 12px}
#offline-screen .off-modes{display:flex;gap:6px;margin-top:8px}
#offline-screen .off-modes span{font-size:13px;color:#8a9099;padding:5px 12px}
#offline-screen .off-mode-chosen{background:#2b3038;color:#e8e8ea;
  border-radius:6px}
#offline-screen .off-alert{display:block;background:#8a5a00;color:#fff;
  padding:10px 14px;font-size:13.5px;line-height:1.45}
#offline-screen .off-section{display:flex;justify-content:space-between;
  align-items:baseline;gap:10px;margin:20px 0 8px}
#offline-screen .off-section b{font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;color:#5f6672;font-weight:600}
#offline-screen .off-section i{font-style:normal;font-size:11.5px;color:#8a9099;
  text-align:right}
#offline-screen label{display:block;font-size:12px;color:#8a9099;
  margin:12px 0 4px}
#offline-screen .off-star{color:#d8541f}
/* THE FIELD COLOURS FORCED, EACH ONE SEPARATELY.
MEASURED ON A PHONE after three failed approaches: with dark mode switched
on, iOS repaints form fields and listens NEITHER to the declaration on my
own screen nor to the one in the page head. Confirmed by measurement - the
version number in the corner already showed the new page and the fields
were still black.
What is left is the only road the system does not go round: forcing it on
the fields themselves. Ugly, but measured. */
#offline-screen input[type=text],#offline-screen textarea{width:100%;
  box-sizing:border-box;padding:11px 12px;font-size:16px;
  border:1px solid #cfd3d9 !important;border-radius:6px;
  background-color:#ffffff !important;
  background-image:none !important;
  color:#20242b !important;-webkit-text-fill-color:#20242b !important;
  opacity:1 !important;color-scheme:light !important;
  -webkit-appearance:none !important;appearance:none !important}
#offline-screen input[type=text]:focus,#offline-screen textarea:focus{
  outline:none;border-color:#d8541f !important;
  background-color:#ffffff !important}
#offline-screen .off-content{background:#fff;border-radius:10px;
  border:1px solid #e3e6ea;margin:12px;padding:14px}
#offline-screen textarea{height:96px;resize:vertical}
#offline-screen .off-button{display:block;width:100%;box-sizing:border-box;
  padding:13px;margin-top:12px;font-size:15px;text-align:center;
  border-radius:8px;cursor:pointer;font-family:inherit;
  background:#fff;color:#20242b;border:1px solid #b9bec6}
#offline-screen .off-accent{background:#d8541f;color:#fff;border:0}
#offline-screen input[type=file]{display:none}
#offline-screen .off-small{font-size:11.5px;color:#8a9099;margin-top:7px;
  min-height:16px;word-break:break-word}
#offline-screen .off-job{border-top:1px solid #dfe2e6;padding:9px 0}
#offline-screen .off-job b{display:block;font-size:13px;color:#20242b}
#offline-screen .off-job p{margin:3px 0;font-size:13.5px;color:#3d4149}
/* IOS ZOOMS THE SCREEN IN when a field with a font smaller than 16 is
touched. REPORTED FROM USE: after a tap on "New entry" the window came in
zoomed and had to be zoomed back out by hand at every field. Sixteen
points is the only threshold that switches it off. */
@media (max-width:700px){
  .bar-actions-right{display:flex;justify-content:space-between;
    align-items:center;gap:12px}
  input[type=text],input[type=search],input[type=number],textarea,select{
    font-size:16px !important}
}
#off-new-on-phone{position:fixed;right:14px;bottom:14px;z-index:9998;
  background:#d8541f;color:#fff;border:0;border-radius:24px;
  padding:13px 20px;font-size:15px;font-family:inherit;
  box-shadow:0 3px 10px rgba(0,0,0,.28)}
/* WITH THE AI WINDOW OPEN THE BUTTON GOES (reported from a photo of a
phone screen). The AI sheet ends ABOVE THE KEYBOARD, that is exactly where
this button stands - it covered "Send" completely and a question could not
be sent without hiding the keyboard.
THIS IS NOT A NEW RULE BUT THE SAME ONE AS FOR THE FORM: the button
already goes away when a new entry is open (added after it had overlapped
"Save entry"). One rule instead of two.
WHY NOT MOVE IT HIGHER: the keyboard height differs on every phone and
changes with word suggestions, so any "higher by this much" would be
guesswork on somebody else's screen.
THE PRICE, NAMED: to create an entry with the AI window open, it has to be
folded away first - one tap on the bar. */
body[data-ai-window="open"] #off-new-on-phone{display:none}
/* THE SAME WHILE SEARCHING BY HAND (a second report). The cause is one and
the same: when the keyboard comes up the screen becomes half as short, and
the button stands in a corner that something else then occupies. So the
rule is one as well: YOU ARE TYPING - the button is not there. It comes
back when the keyboard is put away. */
body[data-typing="1"] #off-new-on-phone{display:none}
/* AND IT DOES NOT GET IN THE WAY WHILE THE DATABASE IS BROWSED (a third
report). While the list is scrolled the button takes itself out of the way
and comes back half a second after the scrolling stops.
WHY IT DOES NOT SIMPLY VANISH ON SCROLLING DOWN, the way other programs do
it: recognising the direction gets it wrong on Android when the list
bounces at the end, and then the button flickers. Waiting for the end of
the movement has no way of getting it wrong.
IT FADES RATHER THAN VANISHES - smoothly, so that the list movement does
not look like a fault. */
#off-new-on-phone{transition:opacity .18s,transform .18s}
body[data-scrolling="1"] #off-new-on-phone{
  opacity:0;transform:translateY(14px);pointer-events:none}
#startup-error{position:fixed;inset:0;z-index:10001;overflow:auto;padding:18px;
  background:#2a1414;color:#ffdede;font:14px/1.45 sans-serif}
#startup-error h2{margin:0 0 8px;font-size:19px}
#startup-error pre{white-space:pre-wrap;word-break:break-word;font-size:12px;
  background:#000;padding:10px;border-radius:6px}
/* THE VERSION NUMBER BY THE LOGO. It replaces the green status box, which
was ordered deleted. Something has to stay: with no number on screen "it
does not work" and "the fix did not arrive" look identical, and those are
two different things - twice that cost half a day.
Three characters by the logo take no room in the bar, and every screenshot
from the user says by itself which program it came from. */
.version-small{color:#6b727d;font-size:11px;font-weight:400;letter-spacing:0}
#offline-screen label{display:block;margin:14px 0 5px;font-size:13px;color:#9aa0a6}
#offline-screen input[type=text],#offline-screen textarea{width:100%;
  box-sizing:border-box;padding:12px;font-size:16px;border-radius:6px;
  border:1px solid #3a4048;background:#1b1f26;color:#e8e8ea}
#offline-screen textarea{height:92px}
#offline-screen button,#offline-screen .off-file{display:block;width:100%;
  box-sizing:border-box;padding:15px;margin-top:12px;font-size:16px;
  text-align:center;border:0;border-radius:8px;background:#1a6fb5;
  color:#fff;cursor:pointer}
#offline-screen .off-green{background:#146c2e}
#offline-screen input[type=file]{display:none}
#offline-screen #off-chosen,#offline-screen #off-log{font-size:13px;
  color:#9aa0a6;margin-top:8px;min-height:18px}
#offline-screen #off-queue{margin-top:20px;font-size:14px;line-height:1.5}
#offline-screen .off-job{border-top:1px solid #2a2f37;padding:8px 0}
#offline-screen .off-job span{color:#9aa0a6;font-size:12px}
/* THE LIST OF CHOSEN PHOTOS, BEFORE THE ENTRY IS SAVED.
Reported: "when adding photos some little icon is needed to remove one if
the photo came out badly". Until then a single line with file names stood
here and nothing could be taken off - a photo of a finger over the lens
went into the database and could only be deleted in the evening on the
laptop.
THE PREVIEW MATTERS MORE THAN THE CROSS: a bad photo is recognised by eye,
not by the name "photo 2". */

  border-top:1px solid #2a2f37;padding:8px 0}
#offline-screen .off-file-preview{width:46px;height:46px;object-fit:cover;
  border-radius:6px;background:#000;flex:0 0 auto}
#offline-screen .off-file-badge{width:46px;height:46px;border-radius:6px;
  background:#2a2f37;color:#9aa0a6;font-size:11px;display:flex;
  align-items:center;justify-content:center;flex:0 0 auto}
#offline-screen .off-file-desc{flex:1 1 auto;min-width:0;font-size:14px}
#offline-screen .off-file-desc i{display:block;color:#9aa0a6;font-size:12px;
  font-style:normal}
/* Overrides the general rule "#offline-screen button" (full width) -
otherwise the cross would spread across the whole row.
RED, and not grey (reported): grey got lost in the row and it was not
visible that this was a button for deleting. The colour is the one
chipbook uses for deleting everywhere - var(--red) from the window,
that is the same shade as the "Yes, to the Recycle Bin" button. */
#offline-screen .off-delete-file{width:38px;height:38px;flex:0 0 auto;
  margin-top:0;padding:0;border-radius:19px;background:#b42318;
  color:#fff;font-size:20px;line-height:1;font-weight:600}
#offline-screen .off-delete-file:active{background:#8f1d14}

<header class="bar">
  <div class="brand" id="brand" role="button" tabindex="0"
       title="Back to the home screen">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#f0762e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
    </svg>
    <span>chipbook</span>
  </div>

  <div class="searchbox">
    <div class="field-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path>
      </svg>
      <textarea id="search-field" rows="1" autocomplete="off" spellcheck="false"
                placeholder="Search by material, tool, notes&#8230;"></textarea>
      <!-- THE CONVERSATION BAR IN PLACE OF THE SEARCH FIELD. Visible only in
      AI mode, because there the search field does nothing anyway. It says
      what you are talking about and how many questions have been asked;
      a click opens the window. -->
      <button type="button" class="bar-ai" id="bar-ai">
        <svg class="spark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path>
        </svg>
        <span class="what" id="ai-what">Conversation with the AI</span>
        <span class="count" id="ai-count"></span>
        <span class="back" id="ai-back">open &#8595;</span>
      </button>
    </div>
    <button type="button" class="btn-search" id="btn-search">Search</button>
  </div>

  <div class="modes" id="modes">
    <button type="button" data-mode="manual" class="chosen">By hand</button>
    <button type="button" data-mode="ai">Ask the AI</button>
  </div>

  <div class="bar-right">
    <span class="counter" id="counter"></span>
    <!-- THE VERSION NUMBER WAS TAKEN OFF THE BAR on request - it took up
    room and said nothing to somebody who is simply working. It STAYS in
    the program: the server still gives it in /api/status, and the update
    script prints "it was 1, it is 2". All that changed is that it does
    not stand in view. -->
    <!-- The address that gets typed into the phone. It stands in the
    window, because since the program starts from an icon there is no
    black window with this text. The figures alone, with no caption -
    the caption is in the tooltip. Visible only on the computer the
    program runs on. -->
    <span class="counter phone-address" id="phone-address" hidden
          title="type this address into the browser on your phone"></span>
    <!-- The code is permanent - the phone types it once. This button serves
    to CUT OFF: it draws the code anew and every phone has to identify
    itself again. It is not for daily clicking. -->
    <button class="btn btn-small" id="btn-new-code" hidden
            title="draw a new code - every phone will have to type it again">New code</button>
    <button class="btn btn-accent" id="btn-new">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      New entry
    </button>
  </div>
</header>

<div class="bar-alert" id="alarm" hidden></div>

<main>
  <section class="panel col-list">
    <div class="heading-panel">
      <!-- THE ARROW BACK TO THE CUSTOMER LIST. Without it a mistake in
      choosing a customer cost two clicks and a detour through every job:
      "All jobs", then "Customers" again. Going back is to be going back,
      and not going out and coming in afresh. -->
      <button type="button" class="btn btn-quiet" id="btn-back-customers"
              title="Back to the customer list" hidden
              aria-label="Back to the customer list">&#8592;</button>
      <h2 id="list-heading">All jobs</h2>
      <span class="count" id="results-count"></span>
      <!-- CUSTOMERS. Not a separate page, but a second face of the same list:
      you click "Customers", you see the customers, you click one - you are
      back at the entries, but only theirs. A separate page would make you
      go back to the list after every choice. -->
      <button type="button" class="btn btn-quiet" id="btn-customers"
              title="Show the customer list">Customers</button>
    </div>
    <div id="correction" class="correction" hidden></div>
    <div class="list" id="list"></div>
  </section>

  <section class="panel col-detail" id="right-column"></section>

  <!-- THE AI CONVERSATION WINDOW. Until this change the chat sat
  permanently in the left column, above the list, and pushed it down.
  Now it is a window of its own: it folds away with a click beside it
  and comes back with a click on the bar in the beam. Thanks to that
  the jobs can be browsed WITHOUT breaking off the conversation - that
  was asked for outright.
  EVERY IDENTIFIER INSIDE STAYS AS IT WAS - only the parent changed. -->
  <div class="ai-window" id="ai-window">
    <div class="heading-ai">
      <span class="title">
        <svg class="spark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path>
        </svg>
        Ask about your jobs
      </span>
      <button type="button" class="collapse" id="btn-collapse-ai"
              title="Fold the conversation away (Esc)" aria-label="Fold the conversation away">&#8722;</button>
    </div>
    <div id="chat" class="chat" hidden>
      <!-- THE "TALKING ABOUT:" BAR. It shows which job further questions go
      to. The cross takes the pinning off and leaves the bubbles - for
      clearing the conversation there is "Start over". -->
      <div id="bar-conversation" class="bar-conversation" hidden></div>
      <div id="answer-ai" class="answer-ai" hidden></div>
      <div id="chat-field" class="chat-field" hidden>
        <textarea id="chat-input" rows="2" spellcheck="false"
                  placeholder="Write it in your own words&#8230;"></textarea>
        <button type="button" id="chat-send">Send</button>
        <button type="button" id="chat-new" class="quiet"
                title="Start over, with no memory of the earlier questions">Start over</button>
      </div>
    </div>
  </div>
</main>

<!-- THE GATE FOR THE PHONE. It appears only when the page arrived with
no token, that is from a device other than the laptop. -->
<div class="gate" id="gate" hidden>
  <div class="gate-box">
    <h2>Type the code</h2>
    <p>On the computer, in the chipbook window, click the

           autocomplete="off" placeholder="000000">
    <button type="button" id="gate-ok">Enter</button>
    <div class="gate-error" id="gate-error"></div>
  </div>
</div>

window.fetch = function (adres, opcje) {
  const url = String(adres);
  const zapytanie = (url.split("?")[1] || "");
  const sciezka = url.split("?")[0];
  const parametry = new URLSearchParams(zapytanie);

  if (opcje && opcje.method === "POST") {
    if (sciezka === "/api/shutdown") return demoOdpowiedz({done: true});
    return demoOdpowiedz(DEMO_ODMOWA, false);
  }
  if (sciezka === "/api/status") return demoOdpowiedz(DEMO.other["/api/status"]);

  if (sciezka === "/api/jobs") {
    const q = (parametry.get("q") || "").trim().toLowerCase();
    if (DEMO.jobs[q]) return demoOdpowiedz(DEMO.jobs[q]);
    /* PYTANIE, KTOREGO NIE NAGRALISMY. Nie udajemy szukania - mowimy
       wprost, ze demo zna kilka pytan, i wymieniamy je. Udawanie
       wyszukiwarki byloby pokazaniem czegos, czego program nie robi. */
    const pusty = JSON.parse(JSON.stringify(DEMO.jobs[""]));
    pusty.jobs = [];
    pusty.mode = "search";
    pusty.skipped = [];
    pusty.forms = [];
    pusty.corrections = [];
    pusty.__demo_unknown = true;
    /* Strona zaraz narysuje SWOJ komunikat "nie ma takiej rzeczy w bazie".
       W demo to nieprawda: to demo nie zna pytania, a nie program. Dlatego
       tuz po narysowaniu podmieniamy ten komunikat na to, co jest prawda.
       Dwa terminy, bo lista bywa rysowana dwa razy pod rzad. */
    setTimeout(demoPowiedzPrawde, 0);
    setTimeout(demoPowiedzPrawde, 180);
    return demoOdpowiedz(pusty);
  }
  let m = sciezka.match(/^\/api\/jobs\/(\d+)$/);
  if (m && DEMO.job[m[1]]) return demoOdpowiedz(DEMO.job[m[1]]);
  m = sciezka.match(/^\/api\/files\/(\d+)\/preview$/);
  if (m && DEMO.preview[m[1]]) return demoOdpowiedz(DEMO.preview[m[1]]);

  return demoOdpowiedz(DEMO_ODMOWA, false);
};

<script>
"use strict";

/* Empty when the page was opened from a device other than the computer
the program runs on. Then the gate comes first: the code off the laptop
screen traded for a token. On the laptop the token arrives ready and
there is no gate. */
let TOKEN = "demo";
// THESE TWO NAMES STAY AS THEY ARE, and it is not an oversight. Browser
// storage is keyed by origin, so a phone that was paired with the older
// build finds its own entries again under these exact names. Renaming them
// would silently log the phone out - and worse, ABANDON any job typed at
// the machine while the laptop was off, because the queue below is where
// those wait. A job somebody typed is worth more than a tidy name.
const CODE_KEY = "chipbook-kod";

const state = {
  jobs: [],
  words: [],
  chosen: null,
  mode: "empty",          // empty | detail | new
  // YES by default - on the laptop everything is to work as before even
  // for a moment, before the answer about the program state arrives.
  onThisComputer: true,
  customer: "",             // chosen customer - empty means "everybody"
  customerList: false,   // whether the left panel shows customers instead of entries
  customers: [],
  searchMode: "manual",  // manual | ai  (the switch beside the search field)
  conversation: [],            // bubbles in AI mode: {who:"me"|"ai", msg}
  originalQuestion: "",   // this is what we answer; the rest are clarifications
  clarifications: [],     // pairs [the model's question, the person's answer]
  lastModelQuestion: "",
  lastPersonQuestion: "",   // context for questions like "and with what cutter?"
  // PINNING THE CONVERSATION TO ONE JOB (asked for by the end user).
  // As long as something stands here, EVERY further question goes to
  // that entry and the search is not touched at all.
  // The server and the database could do this for ten days - the window
  // never sent the number, so the whole mechanism was dead.
  pinned: null,        // {id, name, customer, material} or null
  // WHETHER CHIPBOOK IS WAITING FOR A PERSON TO POINT AT A JOB.
  // Only when this stands true does a click on a row CHOOSE the job

  waitingForChoice: false,

/* --------------------------------------------------------------- helpers */

const ACCENTS = {"\u0105":"a","\u0107":"c","\u0119":"e","\u0142":"l","\u0144":"n","\u00f3":"o","\u015b":"s","\u017a":"z","\u017c":"z",
                "\u0104":"A","\u0106":"C","\u0118":"E","\u0141":"L","\u0143":"N","\u00d3":"O","\u015a":"S","\u0179":"Z","\u017b":"Z"};

function stripAccents(msg){
  let out = "";
  for (const z of msg) out += (ACCENTS[z] !== undefined ? ACCENTS[z] : z);
  return out;
}

function esc(msg){
  return String(msg == null ? "" : msg)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function ranges(msg, words){
  // we count hit positions on the text with the accents stripped - the
  // mapping is 1:1, so the indexes match the original
  const flat = stripAccents(msg).toLowerCase();
  const marks = [];
  for (const s of words){
    if (!s) continue;
    let fromIndex = 0;
    while (true){
      const i = flat.indexOf(s, fromIndex);
      if (i < 0) break;
      marks.push([i, i + s.length]);
      fromIndex = i + Math.max(1, s.length);
    }
  }
  marks.sort((a,b) => a[0]-b[0]);
  const merged = [];
  for (const z of marks){
    const last = merged[merged.length-1];
    if (last && z[0] <= last[1]) last[1] = Math.max(last[1], z[1]);
    else merged.push(z.slice());
  }
  return merged;
}

function highlight(msg, words){
  const marks = ranges(msg, words);
  if (!marks.length) return esc(msg);
  let out = "", previous = 0;
  for (const [a,b] of marks){
    out += esc(msg.slice(previous, a)) + "<mark>" + esc(msg.slice(a,b)) + "</mark>";
    previous = b;
  }
  return out + esc(msg.slice(previous));
}

function snippet(msg, words, maxLength){
  maxLength = maxLength || 190;
  const single = msg.replace(/\s+/g," ").trim();
  const marks = ranges(single, words);
  if (!marks.length || marks[0][0] < maxLength * 0.5) return highlight(single.slice(0, maxLength), words) + (single.length > maxLength ? "\u2026" : "");
  const start = Math.max(0, marks[0][0] - 50);
  const piece = single.slice(start, start + maxLength);
  return "\u2026" + highlight(piece, words) + (start + maxLength < single.length ? "\u2026" : "");
}

function formatWhen(iso){
  if (!iso) return "";
  const t = iso.replace(" ", "T");
  const d = new Date(t);
  if (isNaN(d)) return iso;
  const nowDate = new Date();
  const day = (x) => x.getFullYear()+"-"+x.getMonth()+"-"+x.getDate();
  const hour = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  if (day(d) === day(nowDate)) return "today " + hour;
  const yesterday = new Date(nowDate.getTime() - 864e5);
  if (day(d) === day(yesterday)) return "yesterday " + hour;
  const month = ["Jan","Feb","Mar","Apr","May","Jun",
                "Jul","Aug","Sep","Oct","Nov","Dec"];
  const year = d.getFullYear() === nowDate.getFullYear() ? "" : " " + d.getFullYear();
  return d.getDate() + " " + month[d.getMonth()] + year;
}

function plural(n, one, many){
  return n === 1 ? one : many;
}

function humanSize(bytes){
  bytes = Number(bytes) || 0;
  if (bytes < 1024) return bytes + " B";
  const units = ["kB","MB","GB"];
  let w = bytes / 1024, i = 0;
  while (w >= 1024 && i < units.length - 1){ w /= 1024; i++; }
  return (w < 10 ? w.toFixed(1) : Math.round(w)).toString().replace(".", ",") + " " + units[i];
}

function extensionOf(name){
  const parts = String(name || "").split(".");
  if (parts.length < 2) return "file";
  return parts.pop().slice(0, 5);
}

function sendFile(jobIdFor, file, onProgress){
  // XMLHttpRequest and not fetch: only it says how much has gone already.
  // A CAM project can weigh hundreds of MB - without this the user stares
  // at nothing.
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", "/api/jobs/" + jobIdFor + "/files");
    x.setRequestHeader("X-Chipbook-Token", TOKEN);
    x.setRequestHeader("X-File-Name", encodeURIComponent(file.name));
    x.setRequestHeader("Content-Type", "application/octet-stream");
    x.upload.onprogress = (e) => {
      if (onProgress && e.lengthComputable) onProgress(e.loaded / e.total);
    };
    x.onload = () => {
      let data = {};
      try { data = JSON.parse(x.responseText); } catch (e) {}
      if (x.status === 200) resolve(data);
      else reject(new Error(data.error_message || ("Error " + x.status)));
    };
    x.onerror = () => reject(new Error("The connection to the program was cut off."));
    x.send(file);
  });
}

function attachDropZone(el, onFiles){
  const picker = el.querySelector("input[type=file]");
  el.addEventListener("click", (e) => { if (e.target !== picker) picker.click(); });
  picker.addEventListener("change", () => {
    if (picker.files.length) onFiles(Array.from(picker.files));
    picker.value = "";
  });
  ["dragenter","dragover"].forEach(z => el.addEventListener(z, (e) => {
    e.preventDefault(); el.classList.add("over");
  }));
  ["dragleave","dragend"].forEach(z => el.addEventListener(z, () => el.classList.remove("over")));
  el.addEventListener("drop", (e) => {
    e.preventDefault(); el.classList.remove("over");
    const fileList = Array.from(e.dataTransfer.files || []);
    if (fileList.length) onFiles(fileList);
  });
}

function dropZoneHtml(id, description){

    '<path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>' +
    // THIS FIELD HAS NO `accept` AND NO `capture` AND THAT IS A DECISION,

    // So every attempt at narrowing TAKES the camera away from the phone

/* How many blocks are visible before "Show all" has to be clicked.
Two - agreed on a preview. */
const VISIBLE_COUNT = 2;
let BLOCK_COUNTER = 0;

/* The button is drawn together with the preview, and the preview is
redrawn every time an entry is opened - that is why we listen on the
whole window instead of hooking on to each button separately. Otherwise
after every redraw one would have to remember to hook up again, and
sooner or later somebody forgets. */
document.addEventListener("click", (ev) => {
  const button = ev.target.closest ? ev.target.closest(".show-more") : null;
  if (!button) return;
  const targetEl = document.getElementById(button.dataset.target);
  if (!targetEl) return;
  const wasHidden = targetEl.hidden;
  targetEl.hidden = !wasHidden;
  button.textContent = wasHidden
    ? "Collapse"
    : ("Show all (" + button.dataset.count + ")");
});

function blockHtml(b){
  const indent = ' style="margin-left:' +
    (Math.min(3, Math.max(0, (b.level || 0) - 1)) * 16) + 'px"';
  if (b.kind === "pairs"){
    if (!b.pairs.length) return '<div class="block"' + indent +
      '><h4>' + esc(b.title) + '</h4></div>';
    return '<div class="block"' + indent + '><h4>' + esc(b.title) + '</h4>' +
      '<div class="table-wrap"><table class="table-xml"><tbody>' +
      b.pairs.map(p =>
        '<tr><td class="field-name">' + esc(p[0]) + '</td><td>' +
        highlight(String(p[1]), state.words) + '</td></tr>').join("") +
      '</tbody></table></div></div>';
  }
  if (b.kind === "table"){
    /* OPERATIONS ONE UNDER ANOTHER, NOT SIDE BY SIDE.
    A turned table used to stand here - field names going down, operations in
    columns. It was made on an explicit wish and was good for a week. We
    changed it because THE END USER said so: he judged that the vertical
    reads better.
    What we lose by it, and this has to be known: comparing operations side
    by side. It used to be visible at a glance that the stock to leave falls
    1.0 -> 0.0 -> 0.0; now one has to scroll down.
    The older version stands in the history of this file, right before the
    commit "feat(ui): setup sheet tables vertical" - it comes back with one
    revert should the comparison turn out to be needed.
    EMPTY FIELDS ARE SKIPPED. In a table an empty cell showed "-", because
    otherwise the columns would drift apart. Vertically there is nothing to
    line up, so a field the file does not hold simply takes no room. */
    const count = b.rows.length;
    const fields = b.columns.slice(1);
    const blocks = b.rows.map((r, i) => {
      const pairs = fields
        .map((k, j) => [k, r[j + 1]])
        .filter(p => String(p[1] == null ? "" : p[1]).trim() !== "");
      return '<div class="op-block"><div class="op-top">' +
        '<span class="op-no">' + (i + 1) + ' of ' + count + '</span>' +
        '<span class="op-title">' +
        highlight(String(r[0] == null ? "" : r[0]), state.words) +
        '</span></div>' +
        pairs.map(p => '<div class="op-pair">' +
          '<span class="op-name">' + esc(p[0]) + '</span>' +
          '<span class="op-value">' +
          highlight(String(p[1]), state.words) + '</span></div>').join("") +
        '</div>';
    });
    const hiddenOnes = blocks.slice(VISIBLE_COUNT).join("");
    const restId = "rest-" + (++BLOCK_COUNTER);
    return '<div class="block"' + indent + '><h4>' + esc(b.title) +
      '<span class="count-in">' + count + '</span></h4>' +
      blocks.slice(0, VISIBLE_COUNT).join("") +
      (hiddenOnes
        ? '<div id="' + restId + '" hidden>' + hiddenOnes + '</div>' +
          '<button type="button" class="show-more" data-target="' + restId +
          '" data-count="' + count + '">Show all (' + count + ')</button>'
        : "") +
      '</div>';
  }
  return "";
}

function previewHtml(z, withTitle){
  const p = state.previews[z.id];
  if (!p) return "";
  let middle = "";
  if (p.kind === "xml" || p.kind === "pdf"){
    middle = (p.blocks || []).map(blockHtml).join("");
    if (!middle) middle = '<div class="preview-notice">This file holds no data to show.</div>';
  } else if (p.kind === "text"){
    middle = '<pre class="file-text">' + p.text_lines.map(l =>
      '<span class="no">' + l[0] + '</span>' + esc(l[1])).join("\n") + '</pre>';
  } else if (p.notice){
    middle = '<div class="preview-notice">' + esc(p.notice) + '</div>';
  }
  return '<div class="file-preview">' +
    (withTitle ? '<h3 class="section-title">From the file ' + esc(p.name) + '</h3>' : '') +
    (p.notice && p.kind !== "error" && p.kind !== "too_big"
       ? '<div class="preview-notice">' + esc(p.notice) + '</div>' : '') +
    middle + '</div>';
}

async function loadPreview(id){
  if (state.previews[id]) return;
  try{ state.previews[id] = await api("/api/files/" + id + "/preview"); }
  catch(e){ state.previews[id] = {kind:"error", name:"", notice:e.message}; }
}

async function loadMainPreviews(w){
  state.previews = {};
  for (const z of (w.attachments || [])){
    if (z.viewable && z.setup_sheet) await loadPreview(z.id);
  }
}

function fileHtml(z){
  return '<div class="file" data-id="' + z.id + '">' +

    '<span class="middle"><div class="name">' + highlight(z.name, state.words) + '</div>' +
      '<div class="small">' + esc(humanSize(z.size_bytes)) +
      (z.present ? "" : " &middot; no longer on disk") + '</div></span>' +
    (z.viewable && !z.setup_sheet
       ? '<button class="btn btn-quiet expand">Show</button>' : '') +
    (z.present ? '<button class="btn btn-light download">Open</button>' : '') +
    // DELETE ONLY ON THIS COMPUTER. From the phone one may append, not
    // delete - a phone is sometimes in a pocket and one touch has no right
    // to throw out somebody's file. The server watches the same
    // independently.
    (state.onThisComputer
       ? '<button class="btn btn-quiet delete-file">Delete</button>' : '') +
    '</div>' +
    (z.viewable && !z.setup_sheet
       ? '<div class="file-preview" id="preview-' + z.id + '" hidden></div>' : '');
